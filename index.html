<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSA Algorithm Solver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Algorithm Solver</h1>

    <!-- Wybór funkcji celu -->
    <div id="functionContainer" style="text-align: center; margin-bottom: 60px;">
        <label for="functionSelect">Wybierz funkcję celu:</label>
        <select id="functionSelect">
            <option value="">-- Wybierz funkcję --</option>
        </select>
    </div>


    <div id="algorithmContainer" style="text-align: center; margin-bottom: 60px;">
        <label for="algorithmSelect">Wybierz algorytm:</label>
        <select id="algorithmSelect">
            <option value="">-- Wybierz algorytm --</option>
        </select>
    </div>

    <form id="solveForm">
        <div id="paramsContainer">
            <!-- Statycznie dodane parametry -->
            <div class="param">
                <h3>Wymiar</h3>
                <label>
                    Dolna granica:
                    <input type="number" step="1" name="LowerBoundary0" min="1" required>
                </label><br>
                <label>
                    Górna granica:
                    <input type="number" step="1" name="UpperBoundary0" min="1" required>
                </label><br>
                <label>
                    Krok:
                    <input type="number" step="1" name="Step0" value="1" required>
                </label><br>
            </div>
            <div class="param">
                <h3>Rozmiar populacji</h3>
                <label>
                    Dolna granica:
                    <input type="number" step="5" name="LowerBoundary1" min="5" required>
                </label><br>
                <label>
                    Górna granica:
                    <input type="number" step="5" name="UpperBoundary1" min="5" required>
                </label><br>
                <label>
                    Krok:
                    <input type="number" step="5" name="Step1" value="5" required>
                </label><br>
            </div>
            <div class="param">
                <h3>Liczba iteracji</h3>
                <label>
                    Dolna granica:
                    <input type="number" step="5" name="LowerBoundary2" min="5" required>
                </label><br>
                <label>
                    Górna granica:
                    <input type="number" step="5" name="UpperBoundary2" min="5" required>
                </label><br>
                <label>
                    Krok:
                    <input type="number" step="5" name="Step2" value="5" required>
                </label><br>
            </div>
            <div id="parameterC" class="param">
                <h3>Podział na eksplorację i eksploatację</h3>
                <label>
                    Dolna granica:
                    <input type="number" value="0.5" step="0.1" name="LowerBoundary3" min="0.1" max="0.9" required>
                </label><br>
                <label>
                    Górna granica:
                    <input type="number" value="0.5" step="0.1" name="UpperBoundary3" min="0.1" max="0.9" required>
                </label><br>
                <label>
                    Krok:
                    <input type="number" value="0.1" step="0.1" name="Step3" value="0.1" required>
                </label><br>
            </div>
            <div class="param">
                <h3>Dolna granica</h3>
                <label>
                    Dolna granica:
                    <input type="number" step="1" name="LowerBoundary4" required>
                </label><br>
                <label>
                    Górna granica:
                    <input type="number" step="1" name="UpperBoundary4" required>
                </label><br>
                <label>
                    Krok:
                    <input type="number" step="1" name="Step4" value="1" required>
                </label><br>
            </div>
            <div class="param">
                <h3>Górna granica</h3>
                <label>
                    Dolna granica:
                    <input type="number" step="1" name="LowerBoundary5" required>
                </label><br>
                <label>
                    Górna granica:
                    <input type="number" step="1" name="UpperBoundary5" required>
                </label><br>
                <label>
                    Krok:
                    <input type="number" step="1" name="Step5" value="1" required>
                </label><br>
            </div>
        </div>
        <button type="submit">Oblicz</button>
    </form>

    <div id="result"></div>

    <script src="script.js"></script>
</body>
</html>
